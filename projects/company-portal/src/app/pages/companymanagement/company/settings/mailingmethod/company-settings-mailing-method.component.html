<form (ngSubmit)="submit()" [formGroup]="getForm()" [nbSpinner]="submitLocked" nbSpinnerMessage=""
      nbSpinnerStatus="success" novalidate>
  <nb-card [nbSpinner]="!isDefined(settings)" nbSpinnerStatus="success">
    <nb-card-header>
      <div class="d-flex flex-row">
        <div class="d-flex flex-row mr-auto sticky-left">
          <div class="align-self-center">
            <ng-container *ngTemplateOutlet="submitButtons"></ng-container>
          </div>
        </div>
        <div class="d-flex flex-row ml-auto sticky-right">
          <div class="header-label">Mailing Options</div>
        </div>
      </div>
    </nb-card-header>
    <nb-card-body>
      <div class="d-flex flex-row">
        <label class="checkbox-container">
          <input [formControl]="getForm().controls.emailPaymentNotification" formControlErrorMessage type="checkbox">
          <span class="checkmark"></span>
          <span class="checkbox-descr">{{Labels.NotificationOfCustomerPayment}}</span>
        </label>
      </div>
      <div *ngIf="emailPaymentNotification" class="d-flex flex-row no-gutters py-2">
        <div class="col-md-6">
          <app-extended-input [labelText]="Labels.NotificationEmail"
                              [required]=true
                              [verticalMode]=true>
            <input [placeholder]="Labels.NotificationEmailPlaceholder" class="form-control qbo-form-control"
                   [maxlength]="MAX_LENGTH.NOTIFICATION_EMAIL"
                   formControlErrorMessage
                   formControlName="paymentNotificationEmail"
                   type="text"/>
          </app-extended-input>
        </div>
      </div>
      <div class="d-flex flex-row">
        <label class="checkbox-container">
          <input [formControl]="getForm().controls.emailSaleHeaderEnabled" formControlErrorMessage type="checkbox">
          <span class="checkmark"></span>
          <span class="checkbox-descr">{{Labels.EmailSaleHeaderEnabled}}</span>
        </label>
      </div>
      <app-extended-input *ngIf="isEmailReceiptEditable" [errorDefs]="{server: {}}"
                          [hasError]="isFieldNotValid('emailReceipt')"
                          [inputErrors]="getForm().get('emailReceipt').errors"
                          [labelContainerClass]="'row col-md-2'"
                          [verticalMode]="true">
        <label class="checkbox-container">
          <input [formControl]="getForm().controls.emailReceipt" formControlErrorMessage type="checkbox">
          <span class="checkmark"></span>
          <span [innerHTML]="Labels.EmailReceipt" class="checkbox-descr"></span>
        </label>
      </app-extended-input>
      <app-extended-input [labelContainerClass]="'row col-md-2'"
                          [labelText]="Labels.MailingMethod"
                          [required]=true
                          [verticalMode]="true">
        <div class="form-check">
          <div *ngFor="let key of enumKeys(MailingMethodEnum)" class="rd">
            <input [value]="key" formControlErrorMessage formControlName="mailingMethod" type="radio"/>
            <label
              [for]="key">{{MailingMethodEnumValue.get(key)}}</label>
          </div>
        </div>
      </app-extended-input>
      <div class="d-flex flex-row">
        <label class="checkbox-container">
          <input [formControl]="getForm().controls.paymentFormSubmissionNotification" formControlErrorMessage type="checkbox">
          <span class="checkmark"></span>
          <span class="checkbox-descr">{{Labels.PaymentFormSubmissionNotification}}</span>
        </label>
      </div>
      <div *ngIf="paymentFormSubmissionNotification" class="d-flex flex-row no-gutters py-2">
        <div class="col-md-6">
          <app-extended-input [labelText]="Labels.NotificationEmail"
                              [required]=true
                              [verticalMode]=true>
            <input [placeholder]="Labels.NotificationEmailPlaceholder" class="form-control qbo-form-control"
                   [maxlength]="MAX_LENGTH.NOTIFICATION_EMAIL"
                   formControlErrorMessage
                   formControlName="paymentFormSubmissionNotificationEmail"
                   type="text"/>
          </app-extended-input>
        </div>
      </div>
      <ng-container *ngIf="showSmtpFields">
        <div formGroupName="privateSmtp">
          <div class="form-group row">
            <div class="col-md-6">
              <app-extended-input [labelText]="Labels.FromAddress"
                                  [required]=true
                                  [verticalMode]=true>
                <input [maxlength]="MAX_LENGTH.FROM"
                       [placeholder]="Labels.FromAddress" class="form-control ng-trim-ignore qbo-form-control"
                       formControlErrorMessage
                       formControlName="from"
                       type="text">
              </app-extended-input>
            </div>
          </div>
          <div class="form-group row">
            <div class="col-md-6">
              <app-extended-input [labelText]="Labels.SMTPServer"
                                  [required]=true
                                  [verticalMode]=true>
                <input [maxlength]="MAX_LENGTH.SERVER"
                       [placeholder]="Labels.SMTPServer"
                       class="form-control ng-trim-ignore qbo-form-control"
                       formControlErrorMessage
                       formControlName="server"
                       type="text">
              </app-extended-input>
            </div>
          </div>
          <div class="form-group row">
            <div class="col-md-3">
              <app-extended-input [labelContainerClass]="'row col-md-2'"
                                  [labelText]="Labels.SecurityMode"
                                  [required]=true
                                  [verticalMode]="true">
                <div class="form-check">
                  <div *ngFor="let key of enumKeys(PrivateSmtpSecurityMode)" class="rd">
                    <input [value]="key" formControlErrorMessage formControlName="securityMode" type="radio"/>
                    <label
                      [for]="key">{{PrivateSmtpSecurityModeValue.get(key)}}</label>
                  </div>
                </div>
              </app-extended-input>
            </div>
            <div class="col-md-3">
              <app-extended-input [labelText]="Labels.Port"
                                  [required]=true
                                  [verticalMode]=true>
                <input [maxlength]="MAX_LENGTH.PORT" [placeholder]="Labels.Port"
                       class="form-control ng-trim-ignore qbo-form-control"
                       formControlErrorMessage
                       formControlName="port"
                       type="text">
              </app-extended-input>
            </div>
          </div>
          <div class="form-group row">
            <div class="col-md-6">
              <app-extended-input [labelText]="Labels.User"
                                  [required]=true
                                  [verticalMode]=true>
                <input [maxlength]="MAX_LENGTH.USER"
                       [placeholder]="Labels.User" class="form-control ng-trim-ignore qbo-form-control"
                       formControlErrorMessage
                       formControlName="user"
                       type="text">
              </app-extended-input>
            </div>
            <div class="col-md-6">
              <app-extended-input [labelText]="Labels.Password"
                                  [required]=true
                                  [verticalMode]=true>
                <input [maxlength]="MAX_LENGTH.PASSWORD" [placeholder]="Labels.Password"
                       class="form-control ng-trim-ignore qbo-form-control"
                       formControlErrorMessage
                       formControlName="password"
                       autocomplete="private-smtp-password"
                       type="password">
              </app-extended-input>
            </div>
          </div>
        </div>
      </ng-container>

    </nb-card-body>
  </nb-card>
</form>

<ng-template #submitButtons>
  <button [disabled]="!isSubmitEnabled()" class="btn btn-sm btn-rectangle btn-primary ml-1" type="submit">
    <nb-icon icon="checkmark-outline"></nb-icon>
    Save
  </button>
</ng-template>
