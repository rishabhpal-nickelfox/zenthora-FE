<div class="d-flex justify-content-center">
    <h3>{{Labels.Hello}}, {{username}}</h3>
</div>
<div class="d-flex justify-content-center">
    <h6 class="text-hint">{{Labels.Hint}}</h6>
</div>
<div class="mx-auto col-12">
    <div class="form-group">
        <select #selectRole (change)="setRole(selectRole.value)" class="form-control qbo-form-control">
            <option selected value="">{{Labels.SelectRole}}</option>
            <option *ngFor="let role of roles" [value]="role.id">
                {{role.name}} &#64; {{role.entity.legalName}}
                <ng-container *ngIf="isDefined(role.entity.vaultCompanyId)"> ({{role.entity.vaultCompanyId}})</ng-container>
            </option>
        </select>
    </div>
    <div class="d-flex justify-content-center button-container">
        <button type="button" (click)="onSelect()" [disabled]="!role || submitLocked" [nbSpinner]="submitLocked" class="btn btn-sm"
                nbSpinnerMessage="" nbSpinnerSize="xsmall" nbSpinnerStatus="success">
            <nb-icon icon="checkmark-outline"></nb-icon>
          <span>{{Labels.Submit}}</span>
        </button>
    </div>
</div>

<div class="go-back">
    <a (click)="onCancel()" href="#">{{Labels.GoBack}}</a>
</div>
