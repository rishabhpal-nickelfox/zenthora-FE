<div [class.disabled]="disabled" [class.selected]="selected" [disablePopover]="!disabled"
     [ngbPopover]="paymentMethodErrors" class="payment-method-frame" container="body" placement="bottom"
     triggers="mouseenter:mouseleave">
  <div class="mt-auto mb-auto w-100">
    <ng-container *ngIf="isNew">
      <div class="d-flex mr-auto align-items-center">
        <span class="px-2">{{Labels.New}}</span>
      </div>
    </ng-container>
    <div *ngIf="isCC" class="d-flex flex-row align-items-center pt-3">
      <div class="d-flex mr-auto align-items-center">
        <div *ngIf="ccLogoURL" class="px-2">
          <img alt="credit-card-logo" height="35" src="{{'assets/creditcardlogo/'+ccLogoURL}}"/>
        </div>
        <div class="px-2">
          {{CreditCardEnumValue.get(cc.cardType)}}
        </div>
      </div>
      <div class="d-flex ml-auto">
        <div class="px-2">
          {{cc.number}}
        </div>
        <div class="px-2">
          {{cc.date}}
        </div>
      </div>
    </div>
    <div *ngIf="isACH" class="d-flex flex-row align-items-center pt-3">
      <div>
        <img alt="ach-logo" height="40" src="assets/achlogo/ach.png"/>
      </div>
      <div class="d-flex mr-auto px-2">
        {{AccountTypeEnumValue.get(ach.accountType)}}
      </div>
      <div class="d-flex ml-auto px-2">
        {{ach.accountNumber}}
      </div>
    </div>
  </div>

  <div *ngIf="!isNew" class="d-flex flex-row pb-2 mt-auto ">
    <ng-container *ngIf="!disabled">
      <div class="mr-auto">
        <span [hidden]="!isDefault" class="default px-2">Default</span>
      </div>
      <div class="ml-auto">
        <a (click)="onEdit();$event.stopPropagation();" [hidden]="!selected || !canEdit" class="action-link px-2">Edit</a>
        <a (click)="onDelete();$event.stopPropagation();" [hidden]="!selected || !canDelete" class="action-link pr-2">Delete</a>
      </div>
    </ng-container>
  </div>

</div>

<ng-template #paymentMethodErrors>
  <div *ngFor="let error of paymentMethod.errors" class="d-flex flex-row pb-2 mt-auto ml-auto">
    <span style="color: #f89939">{{getDisabledMessage(error)}}</span>
  </div>
</ng-template>
