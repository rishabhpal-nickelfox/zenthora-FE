<div class="modal-header">
  <h4 class="modal-title">{{ReceiptTemplateComponentEnumLabel[ReceiptTemplateComponentEnum.MESSAGE]}}</h4>
  <button (click)="close()" aria-label="Close" class="close" type="button">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="modal-body">
  <form [formGroup]="form">
    <div class="d-flex flex-row toolbar pb-4 pt-2 my-4">
      <div class="d-flex flex-row pb-2">
        <div class="pr-3 d-flex">
          <app-rich-text-editor [formControl]="form.controls.message"
                                [allowedFontSizes]="allowedFontSizes"
                                [defaultFontSize]="defaultFontSize"
                                [defaultColor]="defaultColor"
                                [fontSizeMode]="fontSizeMode"
                                [options]="editorOptions"
                                [placeholders]="placeholders"></app-rich-text-editor>
        </div>
      </div>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button (click)="save()" class="btn btn-xs btn-rectangle btn-primary" type="button">
    <nb-icon icon="checkmark-outline"></nb-icon>
    Save
  </button>
  <button (click)="close()" class="btn btn-xs btn-rectangle btn-danger" type="button">
    <nb-icon icon="minus-outline"></nb-icon>
    Cancel
  </button>
</div>
