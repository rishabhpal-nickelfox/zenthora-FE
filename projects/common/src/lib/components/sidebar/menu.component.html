<ul class="nav flex-column">
  <li class="nav-item parent" *ngFor="let parentItem of items">
    <ng-container [ngTemplateOutlet]="menuTemplate" [ngTemplateOutletContext]="{item: parentItem}"></ng-container>
  </li>
</ul>

<ng-template #menuTemplate let-item="item">
  <ng-container *ngIf="!item.children" [ngTemplateOutlet]="childTemplate" [ngTemplateOutletContext]="{item: item}"></ng-container>
  <ng-container *ngIf="item.children" [ngTemplateOutlet]="parentTemplate" [ngTemplateOutletContext]="{item: item}"></ng-container>
</ng-template>

<ng-template #parentTemplate let-item="item">
  <div [class.expanded]="item.expanded" [class.active]="isActive(item)" [class.has-children]="item.children">
    <div class="d-flex flex-row align-items-center item">
      <a class="nav-link" (click)="toggleExpanded(item)">
        <nb-icon [icon]="item.icon" *ngIf="item.icon"></nb-icon>
        {{item.title}}
      </a>
    </div>
    <ul class="nav flex-column" [ngbCollapse]="!item.expanded">
      <li class="nav-item child" *ngFor="let childItem of item.children">
        <ng-container [ngTemplateOutlet]="menuTemplate" [ngTemplateOutletContext]="{item: childItem}"></ng-container>
      </li>
    </ul>
  </div>
</ng-template>

<ng-template #childTemplate let-item="item">
  <div [class.active]="isActive(item)">
    <div class="d-flex flex-row item align-items-center">
      <a class="nav-link" (click)="navigate(item.link)">
        <nb-icon [icon]="item.icon" *ngIf="item.icon"></nb-icon>
        {{item.title}}
      </a>
    </div>
  </div>
</ng-template>
