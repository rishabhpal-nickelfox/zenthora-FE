<div>
    <input (ngModelChange)="onInputChanges($event)" [autocomplete]="autocomplete" [maxLength]="MAX_LENGTH" [minLength]="MIN_LENGTH" [ngModel]="value" [placeholder]="placeholder" class="form-control qbo-form-control" type="password">

    <div class="strength">
        <ul class="strengthBar">
            <li *ngFor="let i of [0, 1, 2, 3]" [ngClass]="calcBackgroundColor(i)" class="point"></li>
        </ul>
    </div>

    <div *ngFor="let message of weaknessMessages" class="val-message">
        {{message}}
    </div>
</div>
