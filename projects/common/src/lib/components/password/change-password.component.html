 <form [formGroup]="getForm()" novalidate>
     <div class="form-group">
         <input [hidden]="true" autocomplete="username" type="text">
         <app-extended-input [labelText]="Labels.OldPassword"
                             [verticalMode]="true">
             <input [formControl]="_oldPassword" [maxlength]="PASSWORD_MAX_LENGTH" [placeholder]="Labels.OldPassword"
                    autocomplete="current-password" class="form-control qbo-form-control" formControlErrorMessage
                    type="password">
         </app-extended-input>

         <app-extended-input [labelText]="Labels.NewPassword"
                             [verticalMode]="true">
           <div
             class="text-hint pb-2"><i>{{Labels.PasswordHint(PASSWORD_MIN_LENGTH, PASSWORD_MAX_LENGTH)}}</i>
           </div>

           <app-password-field [formControl]="_newPassword" [placeholder]="Labels.NewPassword"
                                 formControlErrorMessage></app-password-field>
        </app-extended-input>

        <app-extended-input [labelText]="Labels.ConfirmNewPassword" [verticalMode]="true">
            <input [maxlength]="PASSWORD_MAX_LENGTH" autocomplete="new-password"
                   [formControl]="_confirmNewPassword" class="form-control qbo-form-control"
                   formControlErrorMessage
                   [placeholder]="Labels.ConfirmNewPassword"
                   type="password">
        </app-extended-input>
    </div>
</form>
