<input type="text" class="form-control qbo-form-control ng-trim-ignore" [ngModel]="stringValue" (keyup)="keyup($event)"
       (touchend)="onTouched($event)"
       (blur)="onBlur($event)"
       [tabindex]="tabindex" [placeholder]="placeholder" [disabled]="disabled" [textMask]="{mask: numberMask, guide:false}" #instance/>
