<ng-template #customItemTemplate let-model="item" let-index="index">
    <span [hidden]="model._noMatch">{{listFormatter(model)}}</span>
    <span [hidden]="!model._noMatch">No result found</span>
</ng-template>
<div class="d-flex flex-row" #a>
    <ng-container>
        <div class="w-100 search">
            <nb-icon icon="search-outline"></nb-icon>
            <input [ngModel]="searchFieldValue" (ngModelChange)="onTyping($event)" [disabled]="disabled" [extendedTypeahead]="dataSource$" [typeaheadItemTemplate]="customItemTemplate" [typeaheadAsync]="true" [dropup]="dropup" [typeaheadOptionField]="searchProperty" [typeaheadOptionsLimit]="10" (typeaheadOnSelect)="onSelect($event)" (typeaheadOnBlur)="onSelect($event)" (keypress)="onKeyDown($event)" (keyup)="onKeyUp($event)" (focus)="onFocus($event)" (blur)="onBlur()" [typeaheadMinLength]="0" [placeholder]="placeholder" #typeahead class="form-control qbo-form-control typeahead-search" container="body">
        </div>
    </ng-container>
    <ng-container class="p-2" *ngIf="!required && searchFieldValue && !disabled">
        <div class="qfiscal-icon">
            <button type="button" (click)="onRemoveValue($event)">
                <nb-icon icon="close-outline" ngbPopover="Remove" triggers="mouseenter:mouseleave"></nb-icon>
            </button>
        </div>
    </ng-container>
</div>
