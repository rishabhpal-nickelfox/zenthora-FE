<div class="d-flex justify-content-center">
    <h3>{{Labels.PasswordManagementHeader}}</h3>
</div>
<div class="d-flex justify-content-center">
    <h6 class="text-hint">{{Labels.PleaseChangePasswordHint}}</h6>
</div>
<div class="mx-auto col-md-8 col-sm-12">
    <form (ngSubmit)="saveAndClose()" [formGroup]="getForm()">
        <input [hidden]="true" autocomplete="username" type="text">
        <div class="form-group">
            <app-extended-input>
                <input [maxlength]="PASSWORD_MAX_LENGTH" autocomplete="current-password" class="form-control qbo-form-control"
                       [formControl]="_oldPassword"
                       formControlErrorMessage
                       [placeholder]="Labels.OldPassword" type="password">
            </app-extended-input>
        </div>
        <div class="form-group">
            <app-extended-input>
              <div class="d-flex mb-3">
                <span class="password-hint">The password must be 12-20 characters long, contain upper and lower case and special characters</span>
              </div>
                <app-password-field [formControl]="_newPassword"
                                    [placeholder]="Labels.NewPassword"
                                    formControlErrorMessage></app-password-field>
            </app-extended-input>
        </div>
        <div class="form-group">
            <app-extended-input>
                <input [maxlength]="PASSWORD_MAX_LENGTH" autocomplete="new-password" class="form-control qbo-form-control"
                       formControlErrorMessage
                       [formControl]="_confirmNewPassword"
                       [placeholder]="Labels.ConfirmNewPassword" type="password">
            </app-extended-input>
        </div>

        <div class="d-flex justify-content-center button-container">
            <button [disabled]="!isSubmitEnabled()" [nbSpinner]="submitLocked" class="btn btn-sm" nbSpinnerMessage=""
                    nbSpinnerSize="small" nbSpinnerStatus="success" type="submit">
                <nb-icon icon="checkmark-outline"></nb-icon>
                {{Labels.Submit}}
            </button>
        </div>
    </form>
</div>
<div class="go-back">
    <a (click)="onCancel()" href="#">{{Labels.GoBack}}</a>
</div>
