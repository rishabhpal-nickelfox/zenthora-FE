<div class="d-flex justify-content-center">
    <h3>{{Labels.Header}}</h3>
</div>
<div class="d-flex justify-content-center">
    <h6 class="text-hint">{{Labels.Hint}}</h6>
</div>
<form novalidate (ngSubmit)="saveAndClose()" [formGroup]="getForm()">
    <div class="form-group">
        <app-extended-input>
            <input autocomplete="username" class="form-control qbo-form-control" [formControl]="_username" [maxlength]="EMAIL_MAX_LENGTH"
                   [placeholder]="Labels.Email" formControlErrorMessage type="email">
        </app-extended-input>
    </div>
    <div class="d-flex justify-content-center button-container">
        <button type="submit" [disabled]="!isSubmitEnabled()" [nbSpinner]="submitLocked" class="btn btn-sm"
                nbSpinnerMessage="" nbSpinnerSize="small" nbSpinnerStatus="success">
            <nb-icon icon="email-outline"></nb-icon>
            {{Labels.Submit}}
        </button>
    </div>
</form>

<div class="go-back">
    <a (click)="onCancel()" href="#">{{Labels.GoBack}}</a>
</div>
