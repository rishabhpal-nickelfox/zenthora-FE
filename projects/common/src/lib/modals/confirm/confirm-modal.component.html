<div class="modal-header">
  <h4 class="modal-title">{{header}}</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('Cross clicked')">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <span [innerHTML]="htmlBody"></span>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-sm btn-rectangle btn-primary" (click)="activeModal.close(true)">
    <nb-icon icon="checkmark-outline"></nb-icon>
    {{okButtonText}}</button>
  <button type="button" class="btn btn-sm btn-rectangle btn-danger" (click)="activeModal.dismiss('Cancel clicked')">
    <nb-icon icon="minus-outline"></nb-icon>
    {{cancelButtonText}}</button>
</div>
