<div class="modal-header">
    <h4 class="modal-title">{{Labels.ChangePassword}}</h4>
    <button (click)="activeModal.dismiss('Cross clicked')" aria-label="Close" class="close" type="button">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
  <form (ngSubmit)="saveAndClose()" [formGroup]="getForm()" novalidate>
    <app-change-password [formControl]="_changePassword"></app-change-password>
  </form>
</div>
<div class="modal-footer">
    <button type="button" (click)="submit()" [disabled]="!isSubmitEnabled()" [nbSpinner]="submitLocked"
            class="btn btn-sm btn-rectangle btn-primary"
            nbSpinnerStatus="success">
        <nb-icon icon="checkmark-outline"></nb-icon>
        {{Labels.Submit}}
    </button>
    <button type="button" (click)="activeModal.dismiss('Cancel clicked')" class="btn btn-sm btn-rectangle btn-danger">
        <nb-icon icon="minus-outline"></nb-icon>
        {{Labels.Cancel}}
    </button>
</div>
