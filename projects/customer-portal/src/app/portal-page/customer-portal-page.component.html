<div class="portal-layout">
  <header class="portal-header">
    <app-customer-portal-navbar class="app-navbar"></app-customer-portal-navbar>
    <app-to-top-button></app-to-top-button>
  </header>

  <div class="portal-container">
    <aside class="menu-sidebar sidebar-with-button" [class.sidebar-hidden]="sidebarHidden">
      <div class="main-container">
        <div (click)="toggleSidebar()" class="show-hide-sidebar">
          <label>
            <nb-icon icon="arrowhead-left-outline" class="toggle-arrow"></nb-icon>
            <span class="toggle-text">Hide menu</span>
          </label>
        </div>
        <div *ngIf="!sidebarHidden" class="d-flex flex-column sidebar-menu">
          <app-menu class="mt-3"></app-menu>
          <div class="mt-auto powered-by">
            <div class="d-flex flex-row align-items-end">
              <div class="w-60">
                <img [src]="triangleLogo" alt="zenthoraLogo" class="my-3 pl-1 pr-4 brand-logo-url">
              </div>
              <div class="w-40">
                <span class="d-flex justify-content-center pt-3 pr-3">Powered By:</span>
                <img [src]="zenthoraLogo" alt="zenthoraLogo" class="my-3 pl-1 pr-4 brand-logo-url">
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <div class="portal-content">
      <div class="page-content">
        <router-outlet></router-outlet>
      </div>
      <div class="license-agreement">
        <hr/>
        <div class="d-flex justify-content-center">
          <a class="clickable" (click)="onEula()">License Agreement</a>
        </div>
      </div>
    </div>
  </div>
</div>
