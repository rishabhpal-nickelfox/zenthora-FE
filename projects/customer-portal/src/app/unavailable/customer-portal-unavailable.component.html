<div class="unavailable-page">
  <div class="unavailable-page-content">
    <div class="logo-container">
      <h1>Customer</h1>
      <img alt="logo" class="zenthora-logo" src="/assets/zenthoralogo/logo.png">
    </div>
    <div class="content-container">
      <div>
        <h6 class="text-center">{{Labels.UnavailableMessage(currentCustomer?.email, currentCustomer?.companyName)}}</h6>
      </div>
      <div class="d-flex mt-4 justify-content-center button-container">
        <button class="btn btn-sm" (click)="goToSignIn()">
          <nb-icon icon="checkmark-outline"></nb-icon>
          {{Labels.GoToSignIn}}
        </button>
      </div>
    </div>
  </div>
</div>
